<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2d-world</title>
  </head>
  <body>
    <h1>Simulateur de grille</h1>
    <h2>Algorithme : <span id="algoTitle"></span></h2>
    <select id="algoSelect">
      <option value="bfs">BFS</option>
      <option value="dijkstra">Dijkstra</option>
      <option value="a_star">A*</option>
      <option value="a_star_replanned">A* Replannifié</option>
    </select>

    <div id="stats">
      <p>Longueur du chemin : <span id="pathLength"></span></p>
      <p>Coût du chemin : <span id="pathCost"></span></p>
      <p>Nœuds explorés : <span id="exploredNodes"></span></p>
    </div>

    <canvas id="gridCanvas"></canvas>

    <button id="regenBtn">Régénérer la grille</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
